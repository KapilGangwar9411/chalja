<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/images/black.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#7a0404" />
    <meta
      name="description"
      content="Spectrum is a premier student club focused on creative arts, filmmaking, photography, and design. Join our community to unleash your creativity and build professional skills."
    />
    <meta name="keywords" content="Spectrum Club, student filmmaking, photography club, creative arts, short films, campus events" />
    <meta name="author" content="Spectrum Creative Club" />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://spectrum-club.com/" />
    <meta property="og:title" content="Spectrum - Unleash Your Creativity" />
    <meta property="og:description" content="Join Spectrum to explore filmmaking, photography, and design through workshops, competitions, and creative collaborations." />
    <meta property="og:image" content="%PUBLIC_URL%/images/spectrum-og-image.jpg" />
    
    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Spectrum - Unleash Your Creativity" />
    <meta name="twitter:description" content="Join Spectrum to explore filmmaking, photography, and design through workshops, competitions, and creative collaborations." />
    <meta name="twitter:image" content="%PUBLIC_URL%/images/spectrum-og-image.jpg" />
    
    <link rel="canonical" href="https://spectrum-club.com/" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/images/black.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    
    <!-- DNS prefetching for external resources -->
    <link rel="dns-prefetch" href="https://fonts.googleapis.com">
    <link rel="dns-prefetch" href="https://fonts.gstatic.com">
    <link rel="dns-prefetch" href="https://cdnjs.cloudflare.com">
    
    <!-- Preconnect for critical resources -->
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
    
    <!-- Preload critical assets -->
    <link rel="preload" href="%PUBLIC_URL%/fonts/bricolage.ttf" as="font" type="font/ttf" crossorigin="anonymous">
    <link rel="preload" href="%PUBLIC_URL%/fonts/anton.ttf" as="font" type="font/ttf" crossorigin="anonymous">
    
    <!-- Preload critical images for faster initial paint -->
    <link rel="preload" href="%PUBLIC_URL%/images/black.png" as="image">
    
    <!-- Preload critical CSS -->
    <link rel="preload" href="%PUBLIC_URL%/static/css/main.chunk.css" as="style">
    
    <!-- Critical CSS for faster rendering -->
    <style>
      /* Critical CSS for initial render */
      @font-face {
        font-family: 'Bricolage';
        src: url('%PUBLIC_URL%/fonts/bricolage.ttf') format('truetype');
        font-display: swap;
      }
      
      @font-face {
        font-family: 'Anton';
        src: url('%PUBLIC_URL%/fonts/anton.ttf') format('truetype');
        font-display: swap;
      }
      
      body {
        margin: 0;
        padding: 0;
        font-family: 'Arial', sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: optimizeSpeed;
      }
      
      .hero-text h1 {
        font-family: 'Bricolage', 'Anton', sans-serif;
      }

      #root {
        min-height: 100vh;
      }
      
      /* Add loading animation styles */
      .loading-container {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        width: 100%;
      }
      
      .loading-spinner {
        width: 50px;
        height: 50px;
        border: 5px solid rgba(255, 255, 255, 0.3);
        border-radius: 50%;
        border-top-color: #7a0404;
        animation: spin 1s ease-in-out infinite;
      }
      
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
    
    <!-- Structured Data for Organization -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Spectrum Club",
        "url": "https://spectrum-club.com",
        "logo": "https://spectrum-club.com/images/black.png",
        "sameAs": [
          "https://www.instagram.com/brandup.creatives/",
          "https://www.linkedin.com/in/kapil-gangwar-1bbb40251/"
        ],
        "description": "A student-led creative arts and filmmaking club focused on photography, videography, and design."
      }
    </script>
    
    <title>Spectrum Club | Unleash Your Creativity | Student Arts Organization</title>
    
    <!-- Asynchronously load non-critical CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" integrity="sha512-iecdLmaskl7CVkqkXNQ/ZH/XLlvWZOJyj7Yy7tcenmpD1ypASozpmT/E0iPtmFIB46ZmdtAc9eNBvH0H/ZpiBw==" crossorigin="anonymous" referrerpolicy="no-referrer" media="print" onload="this.media='all'" />
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root">
      <!-- Fallback loading indicator that will be replaced when React loads -->
      <div class="loading-container">
        <div class="loading-spinner"></div>
      </div>
    </div>

  </body>
</html>
